<!-- TAB: CROSSWORD PUZZLE -->
<div id="content-crossword" class="hidden space-y-6">
    <div class="glass-panel p-6 sm:p-8 rounded-3xl shadow-xl max-w-xl mx-auto space-y-6 text-center">
        
        <div id="crosswordStartContainer" class="space-y-4">
            <div class="w-16 h-16 bg-brand-500/20 text-brand-500 rounded-3xl mx-auto flex items-center justify-center text-2xl shadow-inner">
                <i class="fa-solid fa-puzzle-piece"></i>
            </div>
            <h3 class="text-xl font-bold">AI Crossword Puzzle</h3>
            <p class="text-xs text-slate-400">Generate a custom crossword puzzle derived from your uploaded notes or general study concepts.</p>
            <button onclick="triggerPreGenCrossword()" class="w-full py-3.5 bg-brand-500 hover:bg-brand-600 text-white font-bold rounded-2xl text-xs shadow-lg shadow-brand-500/20 transition-all">Start Crossword Puzzle</button>
        </div>

        <div id="crosswordLoadingContainer" class="hidden space-y-4 py-8">
            <div class="animate-spin w-10 h-10 border-4 border-brand-500 border-t-transparent rounded-full mx-auto"></div>
            <p class="text-xs font-semibold text-slate-400">Crafting crossword clues and grid with Gemini...</p>
        </div>

        <div id="crosswordActiveContainer" class="hidden space-y-6 text-left">
            <h4 class="font-bold text-sm text-center">Solve the Crossword</h4>
            <div id="crosswordCluesContainer" class="space-y-2 p-4 glass-panel rounded-2xl"></div>
            <div id="crosswordGridContainer" class="space-y-3 py-2"></div>
            <button onclick="verifyCrosswordAnswers()" class="w-full py-3 bg-brand-500 hover:bg-brand-600 text-white font-bold rounded-2xl text-xs transition-all shadow-md">Check Answers</button>
        </div>

        <div id="crosswordResultContainer" class="hidden space-y-4 py-4 text-center">
            <div class="w-16 h-16 bg-emerald-500/20 text-emerald-500 rounded-3xl mx-auto flex items-center justify-center text-2xl">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <h3 class="text-xl font-bold">Puzzle Solved!</h3>
            <p class="text-xs font-semibold text-amber-500">+40 Coins & +50 XP Earned</p>
            <button onclick="resetCrossword()" class="w-full py-3 bg-brand-500 hover:bg-brand-600 text-white font-bold rounded-2xl text-xs transition-all">Play Another Puzzle</button>
        </div>

    </div>
</div>
